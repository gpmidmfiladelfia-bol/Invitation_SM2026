<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#780917"><title>Terang Telah Datang — Christmas Invitation</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#720817;font-family:Arial,sans-serif}body{display:grid;place-items:center}main{width:100%;max-width:540px;position:relative;overflow:hidden;box-shadow:0 12px 60px #23000566}.page{position:relative;width:100%;aspect-ratio:1080/1920;background-size:100% 100%;background-position:center;display:none}.page.active{display:block;animation:appear .5s ease both}#p1{background-image:url('assets/1.png')}#p2{background-image:url('assets/2.png')}#p3{background-image:url('assets/3.png')}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}button,a{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #d8ad5b;outline-offset:2px}.hit{position:absolute;border:0;background:transparent;color:transparent;text-decoration:none}.stamp{left:27%;top:40%;width:46%;height:28%;border-radius:50%;animation:pulse 2.5s ease-in-out infinite}@keyframes pulse{50%{filter:drop-shadow(0 0 14px #f4db9c)}}.rsvp-link{left:32%;top:55.4%;width:36%;height:6.2%}.map-link{left:32%;top:62.5%;width:36%;height:6.2%}.form-input{position:absolute;left:18.6%;top:23.35%;width:62.5%;height:3.9%;background:#ffffff;border:1px solid #a64245;border-radius:7px;font-size:clamp(12px,3.6vw,19px);padding:0 3%;color:#790e19}.choice{position:absolute;left:18.5%;width:63%;height:5.8%;background:transparent;border:2px solid transparent;border-radius:12px}.choice.selected{border-color:#9b1824;background:#fff6f622}.attendance-yes{top:33.4%}.attendance-no{top:40%}.friends-yes{top:51.6%}.friends-no{top:58.3%}.choice.selected:after{content:'✓';position:absolute;right:5%;top:50%;transform:translateY(-50%);font-size:clamp(17px,5vw,26px);color:#8b101c;font-weight:bold}.guest-count{position:absolute;left:18.5%;top:64.5%;width:63%;height:6.7%;display:none;align-items:center;gap:8px;color:#790e19;font-size:clamp(10px,2.7vw,15px);background:#fffaf2f5;border:1px solid #b77a7b;border-radius:9px;padding:5px 10px;z-index:2}.guest-count.visible{display:flex}.guest-count label{flex:1;line-height:1.15}.guest-count input{width:27%;height:90%;min-width:52px;border:1px solid #a64245;border-radius:6px;padding:4px;text-align:center;font:inherit;color:#790e19;background:white}.rating{position:absolute;top:72.1%;height:7.4%;width:11.8%;background:transparent;border:2px solid transparent;border-radius:10px}.rating.selected{border-color:#8b101c;background:#fff6f633}.submit{position:absolute;left:18.5%;top:80.4%;width:63%;height:5%;border:0;background:transparent;color:transparent}.status{position:absolute;left:17%;top:86.5%;width:66%;text-align:center;color:#86111b;font-size:clamp(11px,2.7vw,15px);font-weight:bold;line-height:1.35}.back{position:absolute;top:1.5%;left:3%;background:#fff8e8dd;border:0;border-radius:99px;padding:7px 11px;color:#75101b;font-size:12px;z-index:3}.hint{position:absolute;bottom:3%;width:100%;text-align:center;color:#fff5d8;font-size:12px}.overlay{position:fixed;inset:0;background:#250006a8;display:none;align-items:center;justify-content:center;padding:22px;z-index:5}.overlay.show{display:flex}.modal{background:#fffaf0;color:#74101c;padding:24px;border-radius:18px;max-width:360px;text-align:center;line-height:1.5}.modal button{background:#790d19;color:white;border:0;padding:12px 24px;border-radius:30px;margin-top:10px}.page.opening{animation:openEnvelope .7s ease forwards}@keyframes openEnvelope{to{opacity:0;transform:scale(1.08)}}@media(min-width:700px){main{margin:24px auto;border-radius:8px}.form-input{font-size:18px}}
</style></head><body><main aria-label="Undangan Natal Winner Generation">
<section class="page active" id="p1" aria-label="Amplop undangan"><button class="hit stamp" id="open" aria-label="Klik stamp untuk membuka undangan"></button></section>
<section class="page" id="p2" aria-label="Detail undangan"><button class="back" data-page="1">← Back</button><button class="hit rsvp-link" data-page="3" aria-label="RSVP HERE"></button><a class="hit map-link" id="map" href="https://maps.app.goo.gl/jB3cBdHCyYzwigQ48" target="_blank" rel="noopener" aria-label="LOCATION DETAIL: buka Google Maps"></a></section>
<section class="page" id="p3" aria-label="Form RSVP"><button class="back" data-page="2">← Back</button><form id="form"><input class="form-input" name="name" aria-label="Nama dan panggilan" required maxlength="100" autocomplete="name"><button type="button" class="choice attendance-yes" data-group="attendance" data-value="Pastinya dateng!" aria-label="Pastinya dateng!"></button><button type="button" class="choice attendance-no" data-group="attendance" data-value="Sorry :(" aria-label="Sorry :("></button><button type="button" class="choice friends-yes" data-group="friends" data-value="Iya, ada teman" aria-label="Iya, ada teman"></button><button type="button" class="choice friends-no" data-group="friends" data-value="Aku sendiri" aria-label="Aku sendiri"></button><div class="guest-count" id="guestCountWrap"><label for="guestCount">Berapa teman yang akan kamu bawa?</label><input type="number" id="guestCount" name="guestCount" min="1" max="99" step="1" inputmode="numeric" aria-label="Jumlah teman yang dibawa"></div><button type="button" class="rating" style="left:18.5%" data-rating="1" aria-label="Excitement 1"></button><button type="button" class="rating" style="left:31.1%" data-rating="2" aria-label="Excitement 2"></button><button type="button" class="rating" style="left:43.7%" data-rating="3" aria-label="Excitement 3"></button><button type="button" class="rating" style="left:56.3%" data-rating="4" aria-label="Excitement 4"></button><button type="button" class="rating" style="left:68.9%" data-rating="5" aria-label="Excitement 5"></button><button class="submit" type="submit" aria-label="Kirim RSVP">RSVP</button><div class="status" id="status" role="status"></div></form></section>
</main><div class="overlay" id="dialog"><div class="modal"><h2>RSVP siap! 🎄</h2><p id="dialogText"></p><button id="closeDialog">Tutup</button></div></div><script>
// CONFIG: Paste your deployed Google Apps Script Web App URL here to collect RSVP centrally.
const RSVP_ENDPOINT = 'https://script.google.com/macros/s/AKfycbwUR4zXVM8ckx960qbqneR2ZOP2gS0Z1NpzRu9aapquyvacMLIud23LRftnWA-50Jsg/exec'; // Tempel URL Web App Google Apps Script setelah deployment
const selections={attendance:'',friends:'',rating:0};
function go(n){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active','opening'));document.getElementById('p'+n).classList.add('active');window.scrollTo(0,0)}
document.getElementById('open').addEventListener('click',()=>{document.getElementById('p1').classList.add('opening');setTimeout(()=>go(2),650)});
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));
document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{let g=b.dataset.group;selections[g]=b.dataset.value;document.querySelectorAll('[data-group="'+g+'"]').forEach(x=>x.classList.toggle('selected',x===b));if(g==='friends'){const wrap=document.getElementById('guestCountWrap');const input=document.getElementById('guestCount');const bringing=selections.friends==='Iya, ada teman';wrap.classList.toggle('visible',bringing);input.required=bringing;if(!bringing)input.value=''}}));
document.querySelectorAll('[data-rating]').forEach(b=>b.addEventListener('click',()=>{selections.rating=Number(b.dataset.rating);document.querySelectorAll('[data-rating]').forEach(x=>x.classList.toggle('selected',x===b))}));
document.getElementById('closeDialog').addEventListener('click',()=>document.getElementById('dialog').classList.remove('show'));
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const name=e.target.elements.name.value.trim();const status=document.getElementById('status');if(!name||!selections.attendance||!selections.friends||!selections.rating){status.textContent='Isi semua pertanyaan dulu ya!';return}const guestCount=selections.friends==='Iya, ada teman'?Number(document.getElementById('guestCount').value):0;if(selections.friends==='Iya, ada teman'&&(!Number.isInteger(guestCount)||guestCount<1||guestCount>99)){status.textContent='Isi jumlah teman (1–99) dulu ya!';return}const payload={name,...selections,guestCount,timestamp:new Date().toISOString()};if(!RSVP_ENDPOINT){status.textContent='Mode preview: RSVP belum dikirim ke panitia.';document.getElementById('dialogText').textContent='Form kamu sudah terisi, tapi pengumpulan data belum dihubungkan ke Google Sheets. Hubungkan RSVP_ENDPOINT sebelum website dibagikan.';document.getElementById('dialog').classList.add('show');return}try{status.textContent='Mengirim...';await fetch(RSVP_ENDPOINT,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});status.textContent='RSVP sudah dikirim. Silakan cek konfirmasi ke panitia.';document.getElementById('dialogText').textContent='Terima kasih, '+name+'! Permintaan RSVP sudah dikirim. Panitia akan mengecek datanya di Google Sheets.';document.getElementById('dialog').classList.add('show')}catch(err){status.textContent='Belum berhasil terkirim. Coba lagi atau hubungi panitia.'}});
</script></body></html>
